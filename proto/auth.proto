syntax = "proto3";

option go_package = "./pkg/gen/auth";

message ValidateJWTRequest {
    string jwt = 1;
}

message ValidateJWTResponse {
    bool is_valid = 1;
    string user_id = 2;
    string email = 3;
}

// backend auth service
service AuthService {
    // send jwt - get validate jwt response
    rpc ValidateJwt(ValidateJWTRequest) returns (ValidateJWTResponse) {}
}